requirements:
  - id: REQ-601
    title: Offer a catalogue of bilingual courses
    priority: Must
    description: '[functional] Courses are published in English and Spanish; a learner switches language at any time without losing progress. The initial catalogue covers: blueprint reading vs structural plans, workload planning, avoiding crew idle time, QC before every concrete pour, working with the general contractor, crew cost, tag work and T&M, PT cable accessories, manpower planning, rates, rebar color coding, rigging and picks, personal time management, tonnage, jobsite safety, rebar weight tables, ACI 117 tolerances, the AI plan reader, heat illness prevention, sexual harassment prevention and substance abuse prevention.'
    status: Draft
  - id: REQ-602
    title: Lessons are interactive
    priority: Must
    description: '[functional] A lesson combines short text, images or video, and at least one interaction (question, exercise or calculator) per section.'
    status: Draft
    depends_on:
      - REQ-601
  - id: REQ-603
    title: Quiz each course and track progress
    priority: Must
    description: '[functional] Each course ends with a quiz; the learner''s progress, scores and completion dates are recorded and visible to their manager.'
    status: Draft
    depends_on:
      - REQ-602
  - id: REQ-604
    title: Compliance courses keep a certificate
    priority: Must
    description: '[business-rule] Heat illness prevention, sexual harassment prevention and substance abuse prevention issue a dated completion certificate, retained for the period the company''s compliance policy sets.'
    status: Draft
    depends_on:
      - REQ-603
  - id: REQ-605
    title: Calculate rebar weight and tonnage
    priority: Must
    description: '[functional] A calculator returns weight per bar size (#3 to #18) and length, and total tonnage for a list of bars, using the standard rebar weight table.'
    status: Draft
  - id: REQ-606
    title: Calculate crew cost and rates
    priority: Should
    description: '[functional] A calculator returns crew cost for a crew composition, hours and rates, including overtime.'
    status: Draft
  - id: REQ-607
    title: Check against ACI 117 tolerances
    priority: Should
    description: '[functional] A tool tells whether a measured placement (cover, spacing) is within the ACI 117 tolerance for the element and dimension.'
    status: Draft
  - id: REQ-608
    title: Read plans with AI assistance
    priority: Could
    description: '[functional] A foreman uploads a plan sheet and asks questions; the assistant answers with references to the sheet, and states clearly that answers must be checked against the stamped structural drawings.'
    status: Draft
  - id: REQ-609
    title: Lessons work offline
    priority: Should
    description: '[non-functional] A downloaded course is usable without network; progress syncs later.'
    status: Draft
    depends_on:
      - REQ-602
