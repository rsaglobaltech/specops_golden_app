    priority: Must
    description: '[functional] A foreman creates a log entry for a task or event (delay, instruction from the GC, damage, inspection) with one or more photos; the entry is timestamped and geolocated at capture.'
    status: Draft
  - id: REQ-302
    title: Record audio notes on an entry
    priority: Must
    description: '[functional] A foreman records audio notes (up to 5 minutes each) on an entry; audio is stored with the entry and can be played from the office.'
    status: Draft
  - id: REQ-303
    title: Entries are tamper-evident
    priority: Must
    description: '[business-rule] An entry''s capture time, location and media hashes are fixed at capture; edits append a revision and never change the original, so the log can back a claim with the general contractor.'
    status: Draft
  - id: REQ-304
    title: Transcribe audio notes
    priority: Could
    description: '[functional] Audio notes are transcribed (English and Spanish) so they can be searched and quoted.'
    status: Draft
  - id: REQ-305
    title: Share an entry as evidence
    priority: Should
    description: '[functional] A foreman or the office exports an entry, or a date range of entries, as a PDF with photos, transcript, timestamps and map.'
